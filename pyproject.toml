[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fco-meta"
version = "0.1.0"
description = "FC Online ranker-data meta chatbot"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "google-genai>=2.25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gemini = []  # 호환용: google-genai는 기본 의존성
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
include = ["fco_meta*"]

[tool.setuptools.package-data]
"fco_meta.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

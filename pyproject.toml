[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fco-meta"
version = "0.1.0"
description = "FC Online ranker-data meta chatbot"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fco_meta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

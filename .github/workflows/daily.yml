# 매일 수집: Hugging Face 비공개 데이터셋의 DB를 받아 수집하고, 다시 올려 Render에 재배포를 요청한다.
# 원본 DB는 데이터셋이고, 맥은 개발용이다 (맥에서 run_daily.command를 같이 돌리면 넥슨 호출이 두 번 나가고 DB가 갈라진다).
# 필요한 저장소 Secrets: NEXON_API_KEY, HF_TOKEN(데이터셋 쓰기), RENDER_DEPLOY_HOOK
# 공개 저장소라 이 실행 기록(로그)은 누구나 볼 수 있다 — 자세한 로그(-v)는 켜지 않는다. Secrets 값은 로그에서 가려진다.
name: daily-collection

on:
  schedule:
    - cron: "30 15 * * *"  # 매일 00:30 KST (15:30 UTC)
  workflow_dispatch:  # Actions 탭에서 직접 실행

concurrency:
  group: daily-collection  # 한 번에 하나만 (앞의 수집이 끝나기 전에 다음이 시작되지 않게)
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # GitHub 한도 6시간 안에서
    env:
      NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      HF_DATA_REPO: JM-KIM/fclm-data
      NEXON_DAILY_LIMIT: "50000"  # 서비스 키 (하루 2천만 회·초당 500회) 기준으로 넉넉히
      NEXON_RPS: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install ".[cloud]"
      - name: Download DB (Hugging Face dataset)
        run: python -m fco_meta.cloud pull-db
      - name: Collect (top 10,000)
        run: python -m fco_meta.daily run --top 10000
      - name: Status
        if: always()
        run: python -m fco_meta.daily status
      - name: Upload DB and redeploy Render
        run: python -m fco_meta.cloud push-db  # 수집이 실패하면 이 단계는 건너뛴다 (반쯤 된 DB를 올리지 않음)

    var option = {
        type: 'line',

                pointBorderColor: "#25c7f5",

            }]
        },
        options: {
            elements: {
                line: {
                    tension: 0,
                    borderWidth: 2,
                    offsetGridLines: true
                }
            },
            scales: {
                yAxes: [{
                    ticks: {
                        display: true,
                        beginAtZero: true,
                        fontSize: 10,
                        userCallback: function (value, index, values) {
                            function getKoreanNumber(number) {
                                const koreanNumber = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
                                const tenUnit = ['', '십', '백', '천'];
                                const tenThousandUnit = ['', '만', '억', '조','경'];
                                const unit = 10000;
                                const maxLevel = tenThousandUnit.length - 1;

                                let answer = '';
                                let level = 0;

                                while (number > 0) {
                                    const mod = number % unit;
                                    const modToArray = mod.toString().split('');
                                    const length = modToArray.length - 1;

                                    const modToKorean = modToArray.reduce((acc, value, index) => {
                                        const valueToNumber = +value;
                                        if (!valueToNumber) return acc;
                                        const numberToKorean = index < length && valueToNumber === 1 ? '' : koreanNumber[valueToNumber];
                                        return `${acc}${numberToKorean}${tenUnit[length - index]}`;
                                    }, '');

                                    if (modToKorean) {
                                        answer = `${modToKorean}${tenThousandUnit[level]}${answer}`;
                                    }

                                    level++;
                                    number = Math.floor(number / unit);

                                    if (level > maxLevel) {
                                        break;
                                    }
                                }
                                return answer.trim();
                            }

                            return getKoreanNumber(value)
                        },
                    },
                    gridLines: {
                        lineWidth: 1,
                    },
                }],
                xAxes: [{
                    ticks: {
                        fontColor: "#919199",
                        fontSize: 14,

                        maxTicksLimit: 5,

                    }
                }]

            },

            },

                enabled: false,
                mode: 'index',
                position: 'nearest',
                custom: customTooltips
            }
        }
    };

    function comma(num) {
        var len, point, str;
        num = num + "";
        point = num.length % 3;
        len = num.length;

        str = num.substring(0, point);
        while (point < len) {
            if (str != "") str += ",";
            str += num.substring(point, point + 3);
            point += 3;
        }
        return str;
    }

    function customTooltips(tooltip) {

        // Tooltip Element
        var tooltipEl = document.querySelector('.' + this._chart.canvas.id + ' ._tooltop');

        console.log('.' + this._chart.canvas.id + ' _tooltop')
        console.log(tooltipEl)

        if (!tooltipEl) {
            tooltipEl = document.createElement('div');
            tooltipEl.className = '_tooltop';
            tooltipEl.innerHTML = '<span></span>';
            this._chart.canvas.parentNode.appendChild(tooltipEl);
        }

        // Hide if no tooltip
        if (tooltip.opacity === 0) {
            tooltipEl.style.opacity = 0;
            return;
        }

        function getBody(bodyItem) {
            return bodyItem.lines;
        }

        if (tooltip.body) {
            var bodyLines = tooltip.body.map(getBody);
            var innerHtml = '';

            bodyLines.forEach(function (body, i) {
                innerHtml += '<span class="date">' + tooltip.dataPoints[0].xLabel + '</span>';
                innerHtml += '<span class="bp">' + comma(tooltip.dataPoints[0].yLabel) + ' BP</span>';
            });

            var spanBody = tooltipEl.querySelector('span');
            spanBody.innerHTML = innerHtml;
        }

        var positionY = this._chart.canvas.offsetTop;
        var positionX = this._chart.canvas.offsetLeft;

        // Display, position, and set styles for font
        tooltipEl.style.opacity = 1;
        tooltipEl.style.left = positionX + tooltip.caretX + 'px';
        tooltipEl.style.top = positionY + -65 + tooltip.caretY + 'px';
    }

    function sort(_arr, limit) {
        const arr = { time: _arr.time.slice(-limit), value: _arr.value.slice(-limit) };

        let emptyarr = [];
        let minmaxyarr = [];
        let calcularr = [];

        const average = arr.value.reduce((total, next) => parseInt(total) + parseInt(next), 0) / arr.value.length;

        arr.time.map((item, idx) => {
            if (emptyarr[Math.floor(idx)] === undefined) emptyarr[Math.floor(idx)] = [];
            emptyarr[Math.floor(idx)].push({ time: arr.time[idx], value: arr.value[idx] })
        });

        emptyarr.map((item, idx) => {
            // var min = Math.min(...item.map(_item => _item.value));
            var newarr = [...item.map(_item => _item.value)];
            const valueMin = newarr.reduce((a, b, i) => a[0] < b ? { value: b, time: item[i].time } : a, [Number.MIN_VALUE, -1]);
            const valueMax = newarr.reduce((a, b, i) => a[0] > b ? { value: b, time: item[i].time } : a, [Number.MAX_VALUE, -1]);

            // var max = Math.max(...item.map(_item => _item.value));
            minmaxyarr.push([valueMin, valueMax])

            if (valueMin.value <= average) calcularr.push(valueMin)
            else if (valueMax.value > average) calcularr.push(valueMax)
        })

        return [emptyarr, minmaxyarr, calcularr, parseInt(average)]
    }

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없어요 | FCLM</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/static/favicon.png?v=2">
<meta name="theme-color" content="#101116">
<link rel="stylesheet" href="/static/guide.css">
<style>
  /* 없는 주소: 가이드와 같은 다크 테마 + 연한 FCLM 로고 */
  .nf { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center; position: relative; overflow: hidden; }
  /* 로고 모양 안에만 404와 같은 그라데이션 (왼쪽 보라 → 하늘 → 오른쪽 끝은 옅게) */
  .nf::before { content: ""; position: absolute; left: 50%; top: 50%; translate: -50% -50%; z-index: -1; pointer-events: none;
                width: min(60vw, 600px); aspect-ratio: 132 / 28; opacity: .16;
                background: linear-gradient(90deg, var(--accent), var(--logo-b) 60%, transparent);
                -webkit-mask: url(/static/fclm-logo.png) center / contain no-repeat; mask: url(/static/fclm-logo.png) center / contain no-repeat; }
  .nf .nf-code { margin: 0; font-size: clamp(64px, 14vw, 120px); font-weight: 800; line-height: 1; letter-spacing: -.02em;
             background: linear-gradient(135deg, var(--logo-a), var(--logo-b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .nf h1 { margin: 16px 0 8px; font-size: 22px; }
  .nf p { margin: 0 0 28px; color: var(--muted); }
  .nf-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .nf-actions a { padding: 10px 20px; border-radius: 10px; border: 1px solid var(--line-strong); color: var(--text); text-decoration: none; font-weight: 600; }
  .nf-actions a.primary { background: var(--accent); border-color: transparent; color: var(--on-text); }
  .nf-actions a:hover { opacity: .88; }
  .nf-actions a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main class="nf">
  <div>
    <p class="nf-code">404</p>
    <h1>페이지를 찾을 수 없어요</h1>
    <p>주소가 바뀌었거나 없는 페이지예요.</p>
    <div class="nf-actions">
      <a class="primary" href="/">FCLM 홈</a>
      <a href="/guide">FCLM 가이드</a>
    </div>
  </div>
</main>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCLM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M19.07 4.93A10 10 0 1 0 19.07 19.07' fill='none' stroke='%23a5b4fc' stroke-width='3.2' stroke-linecap='round'/%3E%3Ccircle cx='12' cy='12' r='2.6' fill='%237dd3fc'/%3E%3C/svg%3E">
<meta name="theme-color" content="#09090b">
<style>
  /* 에이전트형 다크 테마: 거의 검은 바탕 + 은은한 빛, 반투명 패널, 얇은 테두리 */
  :root {
    color-scheme: dark;
    --bg: #09090b; --panel: rgba(255, 255, 255, .035); --panel-strong: rgba(255, 255, 255, .06);
    --line: rgba(255, 255, 255, .08); --line-strong: rgba(255, 255, 255, .16);
    --text: #ededef; --muted: #8e8e98; --faint: #5f5f69;
    --accent: #a5b4fc; --glow-a: rgba(99, 102, 241, .16); --glow-b: rgba(56, 189, 248, .10);
    --bar: #3987e5; --track: rgba(255, 255, 255, .06);
    --warn-bg: rgba(242, 204, 96, .10); --warn: #f2cc60;
    --win: #3987e5; --draw: #5a5955; --loss: #e66767;  /* 승·무·패: 파랑↔빨강 + 중립 회색 (dataviz 기준 팔레트, 다크) */
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); min-height: 100vh;
         background: radial-gradient(1100px 520px at 12% -12%, var(--glow-a), transparent 60%),
                     radial-gradient(900px 480px at 100% -8%, var(--glow-b), transparent 60%), var(--bg);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
         -webkit-font-smoothing: antialiased; }
  /* 로고 줄은 왼쪽 칸 맨 위에 둔다 — 오른쪽 챗봇 칸이 페이지 맨 위부터 화면 높이를 꽉 채우도록 */
  header { display: flex; align-items: center; gap: 14px; padding: 12px 2px 4px; }
  header .brand { width: 44px; height: 44px; border-radius: 14px; background: var(--panel-strong); border: 1px solid var(--line);
                  display: flex; align-items: center; justify-content: center; flex: none; }
  header h1 { margin: 0; line-height: 0; }
  header h1 svg { height: 26px; width: auto; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; /* 챗봇이 주 기능이라 반반 */
         max-width: 1640px; margin: 0 auto; padding: 16px; } /* 위아래 16px = 챗봇 칸 sticky 여백 */
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0;
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04); }
  section h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .stat { color: var(--muted); font-size: 13px; font-weight: 400; }
  .notice { background: var(--warn-bg); color: var(--warn); border: 1px solid rgba(242, 204, 96, .2); border-radius: 10px; padding: 8px 10px; font-size: 13px; margin: 6px 0; }
  .error { color: #ff8a8a; font-size: 14px; margin-top: 12px; }
  .foot { color: var(--faint); font-size: 12px; margin-top: 12px; }
  button { font: inherit; background: var(--text); color: #0b0b0d; border: none; border-radius: 999px; padding: 8px 16px;
           cursor: pointer; font-weight: 600; transition: opacity .15s, background .15s; }
  button:hover { opacity: .9; }
  button:disabled { opacity: .5; cursor: wait; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea { font: inherit; color: var(--text); background: rgba(0, 0, 0, .35); border: 1px solid var(--line); border-radius: 16px;
             padding: 12px 16px; min-width: 0; transition: border-color .15s; resize: none; line-height: 1.5; }
  textarea::placeholder { color: var(--faint); }
  textarea:focus { border-color: var(--line-strong); outline: none; }

  /* formation distribution */
  .fchart { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; }
  .fchart .f { font-size: 13px; font-variant-numeric: tabular-nums; }
  .fchart .track { height: 14px; background: none; padding: 0; border-radius: 0; cursor: pointer; display: block; width: 100%; }
  .fchart .track > span { display: block; height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; transition: filter .15s; }
  .fchart .track:hover > span, .fchart .track:focus-visible > span { filter: brightness(1.2); }
  .fchart .track.sel > span { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--text); }
  .fchart .v { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fchart .other { grid-column: 1 / -1; font-size: 12px; color: var(--faint); }

  /* formation detail */
  .fd-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .fd-head h2 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; container-type: inline-size; }
  @media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tile { background: var(--panel-strong); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .val { font-size: clamp(14px, 3cqi, 20px); font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; } /* 타일 폭에 맞춰 한 줄로 */
  .tile .sub { font-size: 11px; color: var(--faint); }
  h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: none; margin: 22px 0 10px; }
  .seg { display: inline-flex; background: rgba(0, 0, 0, .35); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { background: none; color: var(--muted); font-weight: 500; font-size: 13px; padding: 5px 14px; }
  .seg button.on { background: var(--panel-strong); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .caption { font-size: 13px; color: var(--muted); margin: 10px 0; }
  .pitch { position: relative; width: 100%; max-width: 380px; aspect-ratio: 68 / 88; margin: 0 auto; border-radius: 14px; overflow: hidden;
           border: 1px solid var(--line);
           background: radial-gradient(120% 80% at 50% 0%, rgba(99, 102, 241, .18), transparent 70%),
                       repeating-linear-gradient(180deg, #11151c 0 11.1%, #0e1218 11.1% 22.2%); }
  .pitch::before { content: ""; position: absolute; inset: 4%; border: 1px solid rgba(255, 255, 255, .16); border-radius: 4px; }
  .pitch .mid { position: absolute; left: 4%; right: 4%; top: 50%; border-top: 1px solid rgba(255, 255, 255, .16); }
  .pitch .circle { position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%);
                   border: 1px solid rgba(255, 255, 255, .16); border-radius: 50%; }
  .pitch .box { position: absolute; left: 26%; right: 26%; height: 14%; border: 1px solid rgba(255, 255, 255, .16); }
  .pitch .box.top { top: 4%; border-top: 0; } .pitch .box.bottom { bottom: 4%; border-bottom: 0; }
  .pp { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; width: 22%; }
  .pp .ph { position: relative; width: 44px; height: 44px; border-radius: 50%; background: #1a1d24; overflow: hidden;
            display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700;
            border: 1px solid var(--line-strong); box-shadow: 0 0 18px rgba(99, 102, 241, .25); }
  .pp .ph img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .pp .gr { position: absolute; right: -4px; bottom: -2px; background: #0b0b0d; color: #ffd24a; font-size: 10px; font-weight: 700;
            border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 4px; line-height: 14px; }
  .pp .nm { margin-top: 3px; max-width: 100%; font-size: 11px; color: var(--text); text-align: center; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(0, 0, 0, .9); display: flex; align-items: center; gap: 2px; }
  .pp .nm img { height: 11px; }
  @media (max-width: 520px) { .pp .ph { width: 34px; height: 34px; } .pp .nm { font-size: 10px; } }
  .empty-pitch { display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 20%; font-size: 13px; height: 100%; }
  .mu { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; font-size: 13px; }
  .mu .f { font-variant-numeric: tabular-nums; }
  .mu .stack { display: flex; height: 10px; gap: 2px; }
  .mu .stack span { border-radius: 3px; min-width: 2px; }
  .mu .v { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 520px) { .two { grid-template-columns: minmax(0, 1fr); } }
  .rows { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; font-size: 13px; }
  .rows .v { color: var(--muted); font-variant-numeric: tabular-nums; }
  .band { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 8px; align-items: center; font-size: 12px; }
  .band .track { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .band .track span { display: block; height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
  .band .v { color: var(--muted); font-variant-numeric: tabular-nums; }

  #tip { position: fixed; pointer-events: none; background: #16161a; color: var(--text); border: 1px solid var(--line-strong); font-size: 12px;
         padding: 6px 9px; border-radius: 8px; white-space: pre; z-index: 10; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }

  /* chat */
  #chat { display: flex; flex-direction: column; height: 100%; min-height: 480px; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 10px; max-height: 60vh; }
  /* 넓은 화면: 챗봇 칸이 화면 높이를 채우고 입력창은 맨 아래 (#log 뒤에 와야 60vh 제한을 푼다) */
  @media (min-width: 861px) { #chat { position: sticky; top: 16px; align-self: start; height: calc(100vh - 32px); } #log { max-height: none; } }
  .msg { max-width: 92%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .msg.me { align-self: flex-end; background: var(--text); color: #0b0b0d; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--panel-strong); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  /* 마크다운으로 그린 답 (static/md.js) */
  .msg.md { white-space: normal; line-height: 1.55; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: 0 0 8px; }
  .md ul, .md ol { padding-left: 20px; } .md li + li { margin-top: 2px; }
  .md h1, .md h2, .md h3, .md h4 { font-size: 14px; font-weight: 600; color: var(--text); margin: 12px 0 6px; }
  .md strong { color: #fff; font-weight: 600; }
  .md a { color: var(--accent); }
  .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; background: var(--panel-strong);
             border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  .md pre { background: #0f0f12; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
  .md pre code { background: none; border: 0; padding: 0; }
  .md blockquote { border-left: 3px solid var(--line-strong); padding-left: 10px; color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .md table { display: block; overflow-x: auto; border-collapse: collapse; /* 넓은 표는 말풍선 안에서 가로로 스크롤 */ font-size: 13px; font-variant-numeric: tabular-nums; }
  .md th, .md td { border-bottom: 1px solid var(--line); padding: 5px 10px; text-align: left; white-space: nowrap; }
  .md [align="right"] { text-align: right; } .md [align="center"] { text-align: center; }
  .md th { color: var(--muted); font-weight: 600; border-bottom-color: var(--line-strong); }
  .msg.pending { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 8px 16px 8px 10px; }
  .msg.pending canvas { flex: none; }
  .msg.cancelled { color: var(--muted); font-size: 13px; }
  /* 기다리는 동안 글자 위로 빛이 지나간다 */
  .shimmer { background: linear-gradient(90deg, var(--muted) 0%, var(--muted) 40%, #fff 50%, var(--muted) 60%, var(--muted) 100%);
             background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
             animation: shimmer 2.2s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
  @media (prefers-reduced-motion: reduce) { .shimmer { animation: none; color: var(--muted); background: none; } }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
  .examples button { background: var(--panel-strong); color: var(--text); border: 1px solid var(--line); font-weight: 500; font-size: 12px; padding: 5px 12px; }
  .examples button:hover { border-color: var(--line-strong); opacity: 1; }
  #chat form { display: flex; gap: 8px; align-items: flex-end; }
  #msg-beam { flex: 1; display: flex; min-width: 0; }
  #chat form textarea { flex: 1; }
</style>
</head>
<body>
<main>
  <div class="col">
  <header>
    <div class="brand"><canvas id="brand-orb" width="32" height="32" aria-hidden="true"></canvas></div>
    <div>
      <!-- FCLM 로고: 획으로 그린 글자, C는 센터서클과 센터스폿 -->
      <h1><svg viewBox="0 0 80 24" role="img" aria-label="FCLM"><title>FCLM</title>
        <defs><linearGradient id="logo-g" x1="0" x2="1"><stop offset="0" stop-color="#c7d2fe"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient></defs>
        <g fill="none" stroke="url(#logo-g)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 22V2h12M2 11.5h9"/>
          <path d="M36.07 4.93A10 10 0 1 0 36.07 19.07"/>
          <path d="M42 2v20h11"/>
          <path d="M59 22V2l9 12 9-12v20"/>
        </g>
        <circle cx="29" cy="12" r="2.2" fill="#a5b4fc"/>
      </svg></h1>
      <p id="asof">데이터 불러오는 중…</p>
    </div>
  </header>
  <section aria-labelledby="form-title">
    <h2 id="form-title">포메이션 분포 <span id="form-scope" class="stat"></span></h2>
    <div id="fchart" class="fchart"></div>
    <p id="form-foot" class="foot"></p>
  </section>

  <section id="fdetail" aria-live="polite">
    <p class="stat">포메이션 막대를 누르면 여기에 그 포메이션 정보가 나옵니다.</p>
  </section>
  </div>

  <section id="chat" aria-labelledby="chat-title">
    <h2 id="chat-title">FCLM</h2>
    <div id="log" aria-live="polite"></div>
    <div class="examples" id="examples"></div>
    <form id="chat-form">
      <div id="msg-beam"><textarea id="msg" rows="3" maxlength="500" placeholder="무엇이든 물어보세요 — 예: 레알 5억 미만 공격수 추천해줘 (줄바꿈은 Shift+Enter)"></textarea></div>
      <button type="submit" id="send">보내기</button>
    </form>
  </section>
</main>
<div id="tip" hidden></div>

<script type="module">
import { mountOrb } from "/static/orb.js"; // 생각 중 오브
import { renderMarkdown } from "/static/md.js"; // 답의 마크다운 표시
import { mountBeam } from "/static/beam.js"; // 답을 기다리는 동안 입력창 테두리를 도는 빛
const $ = (id) => document.getElementById(id);
const beam = mountBeam($("msg-beam"));
const el = (tag, props = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v; else if (k === "text") node.textContent = v; else node[k] = v;
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
};
const pct = (x) => (x * 100).toFixed(1) + "%";
const season = (s) => (s || "?").split(" (")[0];
const asOf = (v) => v ? v.slice(0, 16).replace("T", " ") + " 기준" : "";

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = body.detail;
    throw new Error(typeof d === "string" ? d : Array.isArray(d) ? d.map((e) => e.msg).join(", ") : `오류 (${res.status})`);
  }
  return body;
}

async function loadMeta() {
  const meta = await api("/api/meta");
  const scope = meta.daily_scope;
  $("asof").textContent = scope
    ? `랭킹 상위 ${scope.top_rankers}명 · 스쿼드 ${scope.squads_collected}명 · ${asOf(scope.data_as_of)}`
    : "아직 수집된 랭킹이 없습니다";
}

// --- tooltip ---
const tip = $("tip");
function showTip(ev, text) {
  tip.textContent = text;
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  const x = Math.min(ev.clientX + 12, window.innerWidth - r.width - 8);
  const y = ev.clientY - r.height - 10 < 8 ? ev.clientY + 16 : ev.clientY - r.height - 10;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = y + "px";
}
const hideTip = () => { tip.hidden = true; };
const hover = (node, text) => {
  node.addEventListener("mousemove", (ev) => showTip(ev, text));
  node.addEventListener("mouseleave", hideTip);
  return node;
};

// --- formation distribution ---
const MAX_BARS = 8;
let selected = null;

function markSelected() {
  for (const b of $("fchart").querySelectorAll(".track")) b.classList.toggle("sel", b.dataset.formation === selected);
}

async function loadFormations() {
  const box = $("fchart");
  try {
    const d = await api("/api/formations");
    $("form-scope").textContent = "· " + d.team_color;
    const forms = d.formations || [];
    if (!forms.length) {
      box.replaceChildren(el("p", { class: "stat", text: d.note || "랭킹 스냅샷이 없습니다." }));
      $("form-foot").textContent = "";
      return;
    }
    const shown = forms.slice(0, MAX_BARS);
    const rest = forms.slice(MAX_BARS);
    const max = shown[0].share || 1;
    const rows = [];
    for (const f of shown) {
      const detail = `${f.formation}\n랭커 ${f.rankers}명 (${pct(f.share)})`;
      const bar = hover(el("button", { type: "button", class: "track", ariaLabel: `${f.formation}, 랭커 ${f.rankers}명 — 누르면 상세` },
        el("span", { style: `width:${(f.share / max) * 100}%` })), detail);
      bar.dataset.formation = f.formation;
      bar.addEventListener("click", () => { hideTip(); showFormation(f.formation); });
      rows.push(el("span", { class: "f", text: f.formation }), bar, el("span", { class: "v", text: `${f.rankers}명 · ${pct(f.share)}` }));
    }
    if (rest.length) {
      const n = rest.reduce((s, f) => s + f.rankers, 0);
      rows.push(el("span", { class: "other", text: `그 외 ${rest.length}개 포메이션 ${n}명` }));
    }
    box.replaceChildren(...rows);
    $("form-foot").textContent = `${d.note || ""} · ${asOf(d.data_as_of)} · 막대를 누르면 아래에 그 포메이션 정보가 나옵니다`;
    showFormation(shown[0].formation);
  } catch (e) {
    box.replaceChildren(el("p", { class: "error", text: e.message }));
  }
}

// --- formation detail ---
// 선수 사진: 카드 사진 → 선수 기본 사진 → 이름 첫 글자 (넥슨 이미지 CDN을 못 쓰면 글자로 표시)
const IMG = "https://fco.dn.nexoncdn.co.kr/live/externalAssets/common";
function photo(p) {
  const box = el("div", { class: "ph", ariaHidden: "true" });
  const sources = [`${IMG}/playersAction/p${p.sp_id}.png`, `${IMG}/players/p${p.pid}.png`];
  const next = () => {
    const src = sources.shift();
    if (!src) { box.replaceChildren((p.name || "?").slice(0, 1)); return; }
    const img = el("img", { src, alt: "", loading: "lazy" });
    img.onerror = next;
    box.replaceChildren(img);
  };
  next();
  if (p.grade) box.append(el("span", { class: "gr", text: String(p.grade) }));
  return box;
}

// spposition 코드 → 경기장 위치 [x%, y%] (위쪽이 공격 방향, 오른쪽이 R 포지션)
const POS = {
  0: [50, 91], 1: [50, 80], 2: [88, 57], 3: [85, 73], 4: [66, 78], 5: [50, 79], 6: [34, 78], 7: [15, 73], 8: [12, 57],
  9: [64, 62], 10: [50, 63], 11: [36, 62], 12: [86, 44], 13: [68, 48], 14: [50, 49], 15: [32, 48], 16: [14, 44],
  17: [70, 32], 18: [50, 33], 19: [30, 32], 20: [66, 20], 21: [50, 21], 22: [34, 20],
  23: [84, 17], 24: [63, 10], 25: [50, 10], 26: [37, 10], 27: [16, 17],
};
const POS_NAME = ["GK", "SW", "RWB", "RB", "RCB", "CB", "LCB", "LB", "LWB", "RDM", "CDM", "LDM", "RM", "RCM", "CM", "LCM", "LM",
  "RAM", "CAM", "LAM", "RF", "CF", "LF", "RW", "RS", "ST", "LS", "LW"];

function pitch(players, emptyText, detailOf) {
  const box = el("div", { class: "pitch" }, el("div", { class: "mid" }), el("div", { class: "circle" }),
    el("div", { class: "box top" }), el("div", { class: "box bottom" }));
  if (!players || !players.length) {
    box.append(el("div", { class: "empty-pitch", text: emptyText }));
    return box;
  }
  for (const p of players) {
    const [x, y] = POS[p.position] || [50, 50];
    const short = (p.name || "?").split(" ").pop();
    const icon = p.season_img ? el("img", { src: p.season_img, alt: "", loading: "lazy", onerror() { this.remove(); } }) : null;
    const node = el("div", { class: "pp", style: `left:${x}%;top:${y}%` }, photo(p), el("div", { class: "nm" }, icon, short));
    hover(node, `${POS_NAME[p.position] || ""} ${p.name || "?"}\n${season(p.season)} · ${p.grade ?? "-"}강${detailOf(p)}`);
    box.append(node);
  }
  return box;
}

function tile(k, val, sub) {
  return el("div", { class: "tile" }, el("div", { class: "k", text: k }), el("div", { class: "val", text: val }),
            sub ? el("div", { class: "sub", text: sub }) : null);
}

function renderPitchArea(d) {
  const area = el("div");
  const top = d.top_ranker_squad, best = d.best_eleven;
  const views = {
    top: () => {
      if (!top) return [el("p", { class: "caption", text: "스쿼드 수집 랭커 중 이 포메이션을 쓰는 랭커가 아직 없습니다." }),
                        pitch([], "매일 수집으로 스쿼드가 쌓이면 표시됩니다", () => "")];
      const rec = top.wins != null ? ` · 시즌 ${top.wins}승 ${top.draws}무 ${top.losses}패` : "";
      const res = top.result ? ` · 이 경기 ${top.result}${top.score ? " " + top.score : ""}` : "";
      const out = [el("p", { class: "caption", text: `${top.rank}위 랭커 · ${top.team_color || "팀컬러 미상"} · ELO ${Math.round(top.elo)}${rec}${res}` })];
      if (!top.formation_match)
        out.push(el("div", { class: "notice", text: `이 경기 실제 배치는 ${top.played_formation || "알 수 없음"}입니다 (랭킹 표시는 ${d.formation}).` }));
      out.push(pitch(top.players, "", (p) => (p.rating != null ? ` · 평점 ${p.rating}` : "")));
      return out;
    },
    best: () => {
      if (!best) return [el("p", { class: "caption", text: "이 포메이션으로 실제 경기한 스쿼드가 아직 없습니다." }),
                         pitch([], "매일 수집으로 스쿼드가 쌓이면 표시됩니다", () => "")];
      return [el("p", { class: "caption", text: `이 포메이션으로 경기한 랭커 ${best.squads}명 · 자리마다 가장 많이 쓴 선수 (가장 흔한 배치 ${best.layout_squads}명)` }),
              pitch(best.players, "", (p) => `\n이 자리 ${p.rankers}명 사용`)];
    },
  };
  const body = el("div");
  const seg = el("div", { class: "seg", role: "tablist" });
  const show = (key) => {
    for (const b of seg.children) b.classList.toggle("on", b.dataset.v === key);
    body.replaceChildren(...views[key]());
  };
  for (const [key, label] of [["top", "최상위 랭커 스쿼드"], ["best", "랭커 베스트 11"]]) {
    const b = el("button", { type: "button", text: label });
    b.dataset.v = key;
    b.addEventListener("click", () => show(key));
    seg.append(b);
  }
  area.append(seg, body);
  show(top ? "top" : "best");
  return area;
}

function renderMatchups(m) {
  if (!m.opponents.length)
    return [el("p", { class: "stat", text: "아직 이 포메이션의 경기 기록이 없습니다. 매일 약 300경기씩 쌓입니다." })];
  const rows = [];
  for (const o of m.opponents.slice(0, 8)) {
    const stack = el("div", { class: "stack", role: "img", ariaLabel: `${o.wins}승 ${o.draws}무 ${o.losses}패` });
    for (const [n, color] of [[o.wins, "var(--win)"], [o.draws, "var(--draw)"], [o.losses, "var(--loss)"]])
      if (n) stack.append(el("span", { style: `flex:${n};background:${color}` }));
    rows.push(el("span", { class: "f", text: "vs " + o.opponent }),
              hover(stack, `vs ${o.opponent}\n${o.games}경기 ${o.wins}승 ${o.draws}무 ${o.losses}패 · 승률 ${pct(o.win_rate)}`),
              el("span", { class: "v", text: `${o.games}경기 ${o.wins}-${o.draws}-${o.losses} · ${pct(o.win_rate)}` }));
  }
  return [
    el("div", { class: "legend" }, el("span", {}, el("i", { style: "background:var(--win)" }), "승"),
       el("span", {}, el("i", { style: "background:var(--draw)" }), "무"), el("span", {}, el("i", { style: "background:var(--loss)" }), "패")),
    el("div", { class: "mu" }, ...rows),
    el("p", { class: "foot", text: `수집된 공식경기 ${m.games}경기 기준 (상대 포메이션은 선발 배치로 추론). 경기 수가 적으면 참고용입니다.` }),
  ];
}

async function showFormation(name) {
  selected = name;
  markSelected();
  const box = $("fdetail");
  box.replaceChildren(el("p", { class: "stat", text: `${name} 불러오는 중…` }));
  try {
    const d = await api("/api/formation?" + new URLSearchParams({ name }));
    if (selected !== name) return;  // 그사이 다른 포메이션을 눌렀으면 버린다
    const r = d.ranking;
    const out = [el("div", { class: "fd-head" }, el("h2", { text: name }),
      el("span", { class: "stat", text: r ? `사용률 ${r.usage_rank}위 / ${r.formations}개 · 랭킹 상위 ${d.ranking_scope}명 중 ${pct(r.share)}` : (d.note || "") }))];
    if (r) {
      const diff = d.all_formations_win_rate != null ? (r.season_win_rate - d.all_formations_win_rate) * 100 : null;
      out.push(el("div", { class: "tiles" },
        tile("시즌 승률", pct(r.season_win_rate), diff != null ? `전체 평균 대비 ${diff >= 0 ? "+" : ""}${diff.toFixed(1)}%p` : ""),
        tile("평균 ELO", String(Math.round(r.avg_elo)), `${r.rankers.toLocaleString()}명`),
        tile("평균 구단가치", r.avg_squad_value || "-", ""),
        tile("최고 순위", `${r.best_rank}위`, "")));
    }
    out.push(el("h3", { text: "스쿼드" }), renderPitchArea(d));
    out.push(el("h3", { text: "상대 포메이션별 전적" }), ...renderMatchups(d.matchups));
    if (r) {
      const teams = el("div", { class: "rows" }, ...d.team_colors.flatMap((t) =>
        [el("span", { text: t.team_color }), el("span", { class: "v", text: `${t.rankers}명 · ${pct(t.share)}` })]));
      const maxBand = Math.max(...d.rank_bands.map((b) => b.share_of_band), 0.0001);
      const bands = el("div", { class: "band" }, ...d.rank_bands.flatMap((b) => [
        el("span", { text: b.rank_band }),
        hover(el("div", { class: "track" }, el("span", { style: `width:${(b.share_of_band / maxBand) * 100}%` })),
              `${b.rank_band}\n${b.rankers}명 (구간의 ${pct(b.share_of_band)})`),
        el("span", { class: "v", text: pct(b.share_of_band) })]));
      out.push(el("div", { class: "two" },
        el("div", {}, el("h3", { text: "많이 쓰는 팀컬러" }), teams),
        el("div", {}, el("h3", { text: "순위 구간별 사용 비율" }), bands)));
    }
    out.push(el("p", { class: "foot", text: `랭킹 ${asOf(d.data_as_of)} · 스쿼드·경기 기록은 매일 상위 300명 수집분` }));
    box.replaceChildren(...out);
  } catch (e) {
    box.replaceChildren(el("p", { class: "error", text: e.message }));
  }
}

// --- chat ---
let sessionId = null;
const say = (who, text) => {
  const node = el("div", { class: "msg " + who, text });
  $("log").append(node);
  $("log").scrollTop = $("log").scrollHeight;
  return node;
};
const THINKING = "랭커데이터를 살펴보고 있어요...";
// 답을 기다리는 동안 보내기 버튼은 정지 버튼이 되고, 누르면 그 요청을 취소한다
let inflight = null;
function setBusy(ctrl) {
  inflight = ctrl;
  beam.set(!!ctrl);
  $("send").type = ctrl ? "button" : "submit";
  $("send").textContent = ctrl ? "■ 정지" : "보내기";
  $("send").setAttribute("aria-label", ctrl ? "답변 정지" : "보내기");
  for (const b of $("examples").children) b.disabled = !!ctrl;
}
$("send").addEventListener("click", (ev) => {
  if (!inflight) return;
  ev.preventDefault(); // 취소하면 버튼이 곧바로 '보내기'로 돌아오므로, 이 클릭이 폼 제출까지 되지 않게 막는다
  inflight.abort();
});
async function send(text) {
  if (inflight) return;
  const ctrl = new AbortController();
  setBusy(ctrl);
  say("me", text);
  const canvas = el("canvas", { ariaHidden: "true" });
  const pending = el("div", { class: "msg bot pending", title: "답을 만드는 동안 왼쪽 포메이션을 둘러보세요" },
    canvas, el("span", { class: "shimmer", text: THINKING }));
  $("log").append(pending);
  $("log").scrollTop = $("log").scrollHeight;
  const stop = mountOrb(canvas, "connecting", 20);
  let answer;
  try {
    const r = await api("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({ message: text, session_id: sessionId }), signal: ctrl.signal });
    sessionId = r.session_id;
    answer = r.answer;
  } catch (e) {
    answer = "오류: " + e.message;
  }
  stop();
  setBusy(null);
  pending.removeAttribute("title");
  if (ctrl.signal.aborted) {
    pending.className = "msg bot cancelled";
    pending.textContent = "답변을 취소했습니다.";
    return;
  }
  pending.className = "msg bot";
  renderMarkdown(pending, answer);
  $("log").scrollTop = $("log").scrollHeight;
}
$("msg").addEventListener("keydown", (ev) => { // Enter는 보내기, Shift+Enter는 줄바꿈 (한글 조합 중인 Enter는 무시)
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
    ev.preventDefault();
    $("chat-form").requestSubmit();
  }
});
$("chat-form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const text = $("msg").value.trim();
  if (!text || inflight) return; // 답을 기다리는 중에는 입력한 글을 그대로 둔다
  $("msg").value = "";
  send(text);
});
for (const q of ["4-2-3-1 쓰는 랭커들 베스트 11 알려줘", "레알 5억 미만 공격수 추천해줘", "상위 10000명 기준 승률 높은 포메이션은?",
                 "라이스랑 수비멘디 비교해줘"]) {
  const b = el("button", { type: "button", text: q });
  b.addEventListener("click", () => send(q));
  $("examples").append(b);
}
say("bot", "시세와 게임 데이터는 수집 시각 기준이며 이적시장에 따라 소폭 변동될 수 있습니다. 무엇이든 물어보세요.");

mountOrb($("brand-orb"), "solving", 32);
loadMeta().catch((e) => { $("asof").textContent = "불러오기 실패: " + e.message; });
loadFormations();
</script>

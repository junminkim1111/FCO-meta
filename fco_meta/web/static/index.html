<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCLM | FC Online 랭커 데이터 기반 AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M19.07 4.93A10 10 0 1 0 19.07 19.07' fill='none' stroke='%23a5b4fc' stroke-width='3.2' stroke-linecap='round'/%3E%3Ccircle cx='12' cy='12' r='2.6' fill='%237dd3fc'/%3E%3C/svg%3E">
<meta name="theme-color" content="#101116">
<style>
  /* 에이전트형 다크 테마: 거의 검은 바탕 + 은은한 빛, 반투명 패널, 얇은 테두리 */
  :root {
    color-scheme: dark;
    --bg: #101116; --bg-2: #262833; --panel: rgba(255, 255, 255, .035); --panel-strong: rgba(255, 255, 255, .06);
    --line: rgba(255, 255, 255, .08); --line-strong: rgba(255, 255, 255, .16);
    --text: #ededef; --muted: #8e8e98; --faint: #5f5f69;
    --accent: #a5b4fc; --glow-a: rgba(99, 102, 241, .16); --glow-b: rgba(56, 189, 248, .10);
    --bar: #3987e5; --track: rgba(255, 255, 255, .06);
    --warn-bg: rgba(242, 204, 96, .10); --warn: #f2cc60;
    --win: #3987e5; --draw: #5a5955; --loss: #e66767;  /* 승·무·패: 파랑↔빨강 + 중립 회색 (dataviz 기준 팔레트, 다크) */
    --on-text: #0b0b0d; --strong: #fff; --error: #ff8a8a; --field: rgba(0, 0, 0, .35); --tip-bg: #16161a; --code-bg: #0f0f12;
    --pitch-1: #11151c; --pitch-2: #0e1218; --pitch-glow: rgba(99, 102, 241, .18); --pitch-line: rgba(255, 255, 255, .16);
    --pitch-name: var(--text); --ph-bg: #1a1d24; --name-shadow: 0 1px 3px rgba(0, 0, 0, .9); --logo-a: #c7d2fe; --logo-b: #7dd3fc;
    --radius: 16px; --pick: #4ade80; /* /compare에서 고를 답 테두리 */
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); min-height: 100vh; background: var(--bg);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
         -webkit-font-smoothing: antialiased; }
  /* 바탕: 화면에 고정된 층 (iOS Safari는 background-attachment: fixed를 무시해 긴 페이지 전체로 늘어난다) */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
                 background: radial-gradient(1100px 520px at 12% -12%, var(--glow-a), transparent 60%),
                             radial-gradient(900px 480px at 100% -8%, var(--glow-b), transparent 60%),
                             linear-gradient(120deg, var(--bg), var(--bg-2)); } /* 왼쪽 위 → 오른쪽 아래로 밝아진다 */
  /* 휴대폰 화면에선 반투명 칸이 바탕과 잘 구분되지 않아 칸과 테두리를 조금 진하게 */
  @media (max-width: 860px) { :root { --panel: rgba(255, 255, 255, .06); --line: rgba(255, 255, 255, .13); } }
  /* 로고 줄은 왼쪽 칸 맨 위에 둔다 — 오른쪽 챗봇 칸이 페이지 맨 위부터 화면 높이를 꽉 채우도록 */
  header { display: flex; align-items: center; gap: 14px; height: var(--head-h); padding: 0 2px; }
  header .brand { width: 44px; height: 44px; border-radius: 14px; background: var(--panel-strong); border: 1px solid var(--line);
                  display: flex; align-items: center; justify-content: center; flex: none; }
  header h1 { margin: 0; line-height: 0; }
  header h1 svg { height: 28px; width: auto; }
  header .logo-a { stop-color: var(--logo-a); } header .logo-b { stop-color: var(--logo-b); }
  main { --head-h: 60px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; /* 챗봇이 주 기능이라 반반 */
         max-width: 1640px; margin: 0 auto; padding: 16px; } /* 위아래 16px = 챗봇 칸 sticky 여백 */
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  /* 좁은 화면(모바일): 한 줄로 쌓고 로고 → 챗봇 → 포메이션 순서 (왼쪽 칸을 풀어 순서를 다시 정한다. .col 규칙 뒤에 와야 함) */
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } .col { display: contents; }
                              header { order: -2; } .side { order: -1; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0;
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04); }
  section h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .stat { color: var(--muted); font-size: 13px; font-weight: 400; }
  .notice { background: var(--warn-bg); color: var(--warn); border: 1px solid rgba(242, 204, 96, .2); border-radius: 10px; padding: 8px 10px; font-size: 13px; margin: 6px 0; }
  .error { color: var(--error); font-size: 14px; margin-top: 12px; }
  .foot { color: var(--faint); font-size: 12px; margin-top: 12px; }
  button { font: inherit; background: var(--text); color: var(--on-text); border: none; border-radius: 999px; padding: 8px 16px;
           cursor: pointer; font-weight: 600; transition: opacity .15s, background .15s; }
  button:hover { opacity: .9; }
  button:disabled { opacity: .5; cursor: wait; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea { font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 16px;
             padding: 12px 16px; min-width: 0; transition: border-color .15s; resize: none; line-height: 1.5; }
  textarea::placeholder { color: var(--faint); }
  textarea:focus { border-color: var(--line-strong); outline: none; }

  /* formation distribution */
  .fchart { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; }
  /* 한 줄(이름·막대·%)이 통째로 버튼: 줄 간격 32px · 올리면 회색 테두리, 상세를 띄운 줄은 흰 테두리 */
  .fchart .row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; margin: 0 -8px;
                 padding: 4px 8px; font: inherit; color: inherit; text-align: left; background: none; border: 1px solid transparent;
                 border-radius: 10px; cursor: pointer; transition: background-color .15s, border-color .15s; }
  .fchart .row:hover, .fchart .row:focus-visible { background: rgba(255, 255, 255, .05); border-color: var(--line-strong); }
  .fchart .row.sel { border-color: var(--text); }
  .fchart .f { font-size: 13px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
  .fchart .logo { width: 18px; height: 18px; flex: none; object-fit: contain; } /* 팀컬러 엠블럼·국기 (없으면 빈 자리) */
  .fchart .track { height: 14px; display: block; width: 100%; }
  .fchart .track > span { display: block; height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; transition: filter .15s; }
  .fchart .row:hover .track > span, .fchart .row:focus-visible .track > span { filter: brightness(1.2); }
  .fchart .v { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fchart:not(.open) .row.extra { display: none; } /* 6위부터는 더보기를 눌러야 보인다 */
  .fchart .more { grid-column: 1 / -1; justify-self: end; margin-top: 2px; padding: 2px 0; font: inherit; font-size: 12px;
                  color: var(--muted); background: none; border: 0; cursor: pointer; }
  .fchart .more:hover { color: var(--text); }

  /* formation detail */
  .fd-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .fd-head h2 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; container-type: inline-size; }
  @media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tile { background: var(--panel-strong); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .val { font-size: clamp(14px, 3cqi, 20px); font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; } /* 타일 폭에 맞춰 한 줄로 */
  .tile .sub { font-size: 11px; color: var(--faint); }
  h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: none; margin: 22px 0 10px; }
  /* 분포 전환 (static/segment.js — React Bits Rubber Segment, MIT + Commons Clause © David Haz) */
  .dist-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .rubber-segment { --rs-track: var(--track); --rs-thumb: var(--text); --rs-ink: var(--text); --rs-ink-active: var(--on-text);
    --rs-radius: 10px; --rs-inset: 3px; --rs-thumb-radius: 7px; --rs-h: 34px; --rs-font: 13px; --rs-pad: 14px; --rs-min: 44px;
    --rs-idle: .7; --rs-hover: .9; --rs-ease-out: cubic-bezier(.23, 1, .32, 1);
    position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); vertical-align: middle;
    padding: var(--rs-inset); border-radius: var(--rs-radius); background: var(--rs-track); border: 1px solid var(--line);
    touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .rubber-segment__item { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: calc(var(--rs-h) - var(--rs-inset) * 2); min-width: var(--rs-min); margin: 0; padding: 0 var(--rs-pad); border: 0;
    border-radius: var(--rs-thumb-radius); background: none; color: var(--rs-ink); opacity: var(--rs-idle); font: inherit;
    font-size: var(--rs-font); font-weight: 600; line-height: 1; white-space: nowrap; cursor: pointer; outline: none;
    transition: opacity 160ms ease, transform 160ms var(--rs-ease-out); }
  .rubber-segment__item:hover { opacity: var(--rs-idle); }
  .rubber-segment__item[aria-checked='true'] { cursor: default; }
  .rubber-segment[data-draggable] .rubber-segment__item[aria-checked='true'] { cursor: grab; }
  .rubber-segment[data-held], .rubber-segment[data-held] .rubber-segment__item { cursor: grabbing; }
  .rubber-segment__item[data-pressed] { transform: scale(.96); }
  .rubber-segment__item:focus-visible { outline: 2px solid var(--rs-thumb); outline-offset: 3px; }
  @media (hover: hover) and (pointer: fine) { .rubber-segment__item[aria-checked='false']:hover { opacity: var(--rs-hover); } }
  .rubber-segment__thumb { position: absolute; inset: var(--rs-inset); display: grid; grid-auto-flow: column;
    grid-auto-columns: minmax(0, 1fr); background: var(--rs-thumb); color: var(--rs-ink-active); pointer-events: none;
    border-radius: var(--rs-thumb-radius); }
  .rubber-segment__copy { color: inherit; opacity: 1; cursor: default; }
  @media (prefers-reduced-motion: reduce) { .rubber-segment__item { transition: opacity 160ms ease; } }
  .seg { display: inline-flex; background: var(--field); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { background: none; color: var(--muted); font-weight: 500; font-size: 13px; padding: 5px 14px; }
  .seg button.on { background: var(--panel-strong); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .caption { font-size: 13px; color: var(--muted); margin: 10px 0; }
  .pitch { position: relative; width: 100%; max-width: 494px; aspect-ratio: 68 / 88; margin: 0 auto; border-radius: 14px; overflow: hidden;
           border: 1px solid var(--line);
           background: radial-gradient(120% 80% at 50% 0%, var(--pitch-glow), transparent 70%),
                       repeating-linear-gradient(180deg, var(--pitch-1) 0 11.1%, var(--pitch-2) 11.1% 22.2%); }
  .pitch::before { content: ""; position: absolute; inset: 4%; border: 1px solid var(--pitch-line); border-radius: 4px; }
  .pitch .mid { position: absolute; left: 4%; right: 4%; top: 50%; border-top: 1px solid var(--pitch-line); }
  .pitch .circle { position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%);
                   border: 1px solid var(--pitch-line); border-radius: 50%; }
  .pitch .box { position: absolute; left: 26%; right: 26%; height: 14%; border: 1px solid var(--pitch-line); }
  .pitch .box.top { top: 4%; border-top: 0; } .pitch .box.bottom { bottom: 4%; border-bottom: 0; }
  .pp { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; width: 22%; }
  .pp .pw { position: relative; } /* 사진 틀: 강화 표시는 둥근 사진 밖으로 나와도 보이도록 사진 옆에 둔다 */
  .pp .ph { width: 57px; height: 57px; border-radius: 50%; background: var(--ph-bg); overflow: hidden;
            display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700;
            border: 1px solid var(--line-strong); box-shadow: 0 0 18px rgba(99, 102, 241, .25); }
  .pp .ph img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  /* 강화 표시: 데이터센터와 같은 색 (1강 회색 · 2~4 동 · 5~7 은 · 8~10 금 · 11~ 백금 무늬) */
  .pp .gr { position: absolute; right: -5px; bottom: -3px; z-index: 1; font-size: 13px; font-weight: 900; border-radius: 3px;
            padding: 0 5px; line-height: 18px; box-shadow: 0 1px 4px rgba(0, 0, 0, .6);
            background: linear-gradient(140deg, #51545a, #42464d); color: #c5c8c9; }
  .pp .gr.bronze { background: linear-gradient(140deg, #de946b, #ad5f42); color: #7e3f27; }
  .pp .gr.silver { background: linear-gradient(140deg, #d8d9dc, #b8bdca); color: #4e545e; }
  .pp .gr.gold { background: linear-gradient(140deg, #f9dd62, #dca908); color: #695100; }
  .pp .gr.platinum { background: #dfe3f5 url(https://ssl.nexon.com/s2/game/fc/online/obt/datacenter/bg_plt.png) 0 0 / 100% 100%; color: #2d2b43; }
  .pp .nm { margin-top: 4px; max-width: 100%; font-size: 14px; color: var(--pitch-name); text-align: center; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; text-shadow: var(--name-shadow); display: flex; align-items: center; gap: 2px; }
  .pp .nm img { height: 14px; }
  @media (max-width: 520px) { .pp .ph { width: 34px; height: 34px; } .pp .nm { font-size: 10px; } .pp .nm img { height: 11px; }
                              .pp .gr { font-size: 10px; line-height: 14px; padding: 0 4px; } }
  .empty-pitch { display: flex; align-items: center; justify-content: center; text-align: center; color: var(--pitch-name); opacity: .75; padding: 20%; font-size: 13px; height: 100%; }
  .mu { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; font-size: 13px; }
  .mu .f { font-variant-numeric: tabular-nums; }
  .mu .stack { display: flex; height: 10px; gap: 2px; }
  .mu .stack span { border-radius: 3px; min-width: 2px; }
  .mu .v { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 520px) { .two { grid-template-columns: minmax(0, 1fr); } }
  .rows { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; font-size: 13px; }
  .rows .v { color: var(--muted); font-variant-numeric: tabular-nums; }
  .band { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 8px; align-items: center; font-size: 12px; }
  .band .track { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .band .track span { display: block; height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
  .band .v { color: var(--muted); font-variant-numeric: tabular-nums; }

  #tip { position: fixed; pointer-events: none; background: var(--tip-bg); color: var(--text); border: 1px solid var(--line-strong); font-size: 12px;
         padding: 6px 9px; border-radius: 8px; white-space: pre; z-index: 10; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }

  /* chat */
  /* 오른쪽 칸: 로고 줄 높이만큼 위에 수집 범위를 두어 챗봇 칸 윗선을 왼쪽 포메이션 칸과 맞춘다 */
  .side { display: flex; flex-direction: column; min-width: 0; }
  #asof { height: calc(var(--head-h) + 16px); margin: 0; padding: 0 4px 6px; display: flex; align-items: flex-end; justify-content: flex-end;
          color: var(--muted); font-size: 13px; }
  @media (max-width: 860px) { #asof { height: auto; justify-content: flex-start; padding: 0 2px 8px; } }
  #chat { display: flex; flex-direction: column; height: 100%; min-height: 480px; }
  /* 챗봇 칸 강조: 로고 색(보라→하늘) 그라데이션 테두리와 바깥 빛, 큰 제목 */
  #chat { position: relative; border-color: transparent;
          box-shadow: 0 0 36px -6px rgba(99, 102, 241, .22), 0 0 80px -20px rgba(56, 189, 248, .17); }
  #chat::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; pointer-events: none;
                  background: linear-gradient(135deg, var(--logo-a), var(--logo-b));
                  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  #chat h2 { font-size: 18px; font-weight: 700; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 10px; max-height: 60vh; }
  /* 넓은 화면: 챗봇 칸이 화면 높이를 채우고 입력창은 맨 아래 (#log 뒤에 와야 60vh 제한을 푼다) */
  @media (min-width: 861px) { .side { position: sticky; top: 16px; align-self: start; height: calc(100vh - 32px); }
                              #chat { flex: 1; min-height: 0; } #log { max-height: none; } }
  .msg { max-width: 92%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  /* 사용자 질문만 말풍선, 챗봇 답은 박스 없이 대화 영역에 바로 (LLM 채팅처럼) */
  .msg.me { align-self: flex-end; max-width: 80%; background: var(--text); color: var(--on-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: stretch; max-width: 100%; padding: 2px; border-radius: 0; line-height: 1.6; }
  /* 마크다운으로 그린 답 (static/md.js) */
  .msg.md { white-space: normal; line-height: 1.55; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: 0 0 8px; }
  .md ul, .md ol { padding-left: 20px; } .md li + li { margin-top: 2px; }
  .md h1, .md h2, .md h3, .md h4 { font-size: 14px; font-weight: 600; color: var(--text); margin: 12px 0 6px; }
  .md strong { color: var(--strong); font-weight: 600; }
  .md a { color: var(--accent); }
  .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; background: var(--panel-strong);
             border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  .md pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
  .md pre code { background: none; border: 0; padding: 0; }
  .md blockquote { border-left: 3px solid var(--line-strong); padding-left: 10px; color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .md table { display: block; overflow-x: auto; border-collapse: collapse; /* 넓은 표는 말풍선 안에서 가로로 스크롤 */ font-size: 13px; font-variant-numeric: tabular-nums; }
  .md th, .md td { border-bottom: 1px solid var(--line); padding: 5px 10px; text-align: left; white-space: nowrap; }
  .md [align="right"] { text-align: right; } .md [align="center"] { text-align: center; }
  .md th { color: var(--muted); font-weight: 600; border-bottom-color: var(--line-strong); }
  .msg.pending { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; }
  .msg.pending canvas { flex: none; }
  .msg.cancelled { color: var(--muted); font-size: 13px; }
  .msg.intro { color: var(--muted); font-size: 13px; } /* 첫 안내 문구 */
  .msg.me + .msg { margin-top: 8px; } /* 질문과 그 답 사이 */
  /* 채팅에 /admin → 관리자 비밀번호 입력 */
  .admin-row { display: flex; gap: 8px; margin-top: 8px; max-width: 360px; }
  .admin-row input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line);
                     border-radius: 10px; padding: 8px 12px; }
  .admin-row button { padding: 8px 14px; }
  .admin-note { color: var(--error); font-size: 13px; margin-top: 6px; }
  /* 명령어 안내 (/deep, /compare …) */
  .msg.note { color: var(--muted); font-size: 13px; }
  .msg.note.done::before { content: "✓ "; color: var(--accent); } /* 명령어가 적용됨 */
  .applied { align-self: flex-start; color: var(--faint); font-size: 12px; margin-top: -4px; } /* 이 답을 낸 모델 (/deep·/compare) */
  /* 세 칸이 다 끝나면: 한 번 누르면 초록 테두리, 같은 칸을 한 번 더 누르면 고르기 창 */
  .pane.selectable { cursor: pointer; transition: border-color .15s, box-shadow .15s, opacity .25s; }
  .pane.selectable.marked { border-color: var(--pick); box-shadow: 0 0 0 1px var(--pick); }
  .pane.selectable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pane.gone { opacity: 0; }
  #pick-dialog { background: var(--tip-bg); color: var(--text); border: 1px solid var(--line-strong); border-radius: 14px; padding: 18px 20px; max-width: 360px; }
  #pick-dialog::backdrop { background: rgba(0, 0, 0, .55); }
  #pick-dialog p { margin: 0 0 14px; font-size: 14px; }
  #pick-dialog .row { display: flex; justify-content: flex-end; gap: 8px; }
  #pick-dialog button { padding: 6px 14px; }
  #pick-dialog .yes { background: var(--pick); color: var(--on-text); border-color: transparent; font-weight: 600; }
  #compare-note { display: none; color: var(--muted); font-size: 13px; font-weight: 400; }
  #chat.comparing #compare-note { display: inline; }
  #chat.comparing #chat-title > .stat { display: none; }
  /* /admin --l: 모델 선택·생각·도구 결과를 답 위에 */
  .trace { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 8px 10px; font-size: 12px; color: var(--muted);
           display: flex; flex-direction: column; gap: 4px; } /* 글이 늘면 칸도 같이 커진다 */
  .trace .tr { white-space: pre-wrap; word-break: break-word; }
  .trace .tr b { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .trace .tr.thought span { color: var(--text); opacity: .75; }
  /* /compare: 챗봇 칸이 화면 전체로 커지고 세 모델이 나란히 답한다 */
  #chat.comparing { position: fixed; inset: 12px; z-index: 20; height: auto; min-height: 0; background: var(--bg); }
  #chat.comparing #log { display: none; }
  #compare-close { display: none; margin-left: auto; padding: 4px 12px; font-size: 13px; }
  #chat.comparing #compare-close { display: inline-block; }
  #chat-title { display: flex; align-items: baseline; gap: 8px; }
  #compare { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  #compare[hidden] { display: none; } /* 위의 display: grid가 hidden을 덮어 비교 칸이 숨은 채로 아래 절반을 차지하던 문제 */
  .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .pane h3 { margin: 0; color: var(--text); display: flex; justify-content: space-between; gap: 8px; }
  .pane h3 .stat { font-size: 12px; }
  .pane .body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  @media (max-width: 860px) { #chat.comparing { inset: 0; border-radius: 0; } #compare { grid-template-columns: minmax(0, 1fr); grid-auto-rows: max-content; overflow-y: auto; }
                              .pane .body { overflow: visible; } }
  /* 기다리는 동안 글자 위로 빛이 지나간다 */
  .shimmer { background: linear-gradient(90deg, var(--muted) 0%, var(--muted) 40%, var(--strong) 50%, var(--muted) 60%, var(--muted) 100%);
             background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
             animation: shimmer 2.2s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
  /* 도구에 맞춰 문구가 바뀔 때 살짝 떠오르며 나타난다 */
  .shimmer.fresh { animation: shimmer 2.2s linear infinite, status-in .35s ease-out; }
  @keyframes status-in { from { opacity: 0; transform: translateY(4px); } }
  .pending .shimmer { display: inline-block; }
  @media (prefers-reduced-motion: reduce) { .shimmer, .shimmer.fresh { animation: none; color: var(--muted); background: none; } }
  #chat form { margin-top: 10px; }
  /* 입력창은 칸 끝까지, 보내기 버튼은 입력창 안 오른쪽 아래 (테두리 빛 위에 오도록 z-index) */
  #msg-beam { display: flex; position: relative; }
  #chat form textarea { flex: 1; padding-right: 60px; }
  /* 보내기(↑)·정지(■): 흰 원형 버튼, 입력창 안 오른쪽 아래 */
  #send { position: absolute; right: 10px; bottom: 10px; z-index: 4; width: 36px; height: 36px; padding: 0; border-radius: 50%;
          display: flex; align-items: center; justify-content: center; background: #fff; color: #0b0b0d;
          box-shadow: 0 1px 3px rgba(0, 0, 0, .2); font-size: 14px; line-height: 1; }
  #send svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<main>
  <div class="col">
  <header>
    <div class="brand"><canvas id="brand-orb" width="32" height="32" aria-hidden="true"></canvas></div>
    <div>
      <!-- FCLM 로고: 획으로 그린 글자, C는 센터서클과 센터스폿 -->
      <h1><svg viewBox="-1 -1 84 26" role="img" aria-label="FCLM"><title>FCLM</title>
        <defs><linearGradient id="logo-g" x1="0" x2="1"><stop offset="0" class="logo-a"/><stop offset="1" class="logo-b"/></linearGradient></defs>
        <g fill="none" stroke="url(#logo-g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 22V2h12M2 11.5h9"/>
          <path d="M38.07 4.93A10 10 0 1 0 38.07 19.07"/>
          <path d="M44 2v20h11"/>
          <path d="M62 22V2l9 12 9-12v20"/>
        </g>
        <circle cx="31" cy="12" r="2.6" style="fill: var(--accent)"/>
      </svg></h1>
    </div>
  </header>
  <section aria-label="랭커 분포">
    <div class="dist-head"><div id="dist-mode"></div><span id="form-scope" class="stat"></span></div>
    <div id="fchart" class="fchart"></div>
  </section>

  <section id="fdetail" aria-live="polite">
    <p class="stat">항목을 누르면 여기에 그 포메이션·팀컬러 정보가 나옵니다.</p>
  </section>
  <!-- 넥슨 Open API 이용 조건: 서비스에 'Data based on NEXON Open API'를 명시 -->
  <footer class="foot">Data based on NEXON Open API · 시세·선수 정보: FC온라인 데이터센터 · 질문은 Google Gemini로 처리되며 서비스 개선을 위해 기록됩니다</footer>
  </div>

  <div class="side">
  <p id="asof">데이터 불러오는 중…</p>
  <section id="chat" aria-labelledby="chat-title">
    <h2 id="chat-title">FCLM <span class="stat">FC Online 랭커 데이터 기반 AI</span><span id="compare-note">해당 질문, 답변과 선택은 모델 개선을 위해 쓰일 수 있습니다.</span><button type="button" id="compare-close">비교 닫기</button></h2>
    <div id="log" aria-live="polite"></div>
    <div id="compare" hidden></div>
    <dialog id="pick-dialog"><form method="dialog"><p>이 답변을 선택할까요? 다른 답변은 사라지고 이 답변으로 대화를 이어 갑니다.</p>
      <div class="row"><button value="no">취소</button><button value="yes" class="yes">선택</button></div></form></dialog>
    <form id="chat-form">
      <div id="msg-beam"><textarea id="msg" rows="3" maxlength="500" placeholder="무엇이든 물어보세요"></textarea><button type="submit" id="send" aria-label="보내기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button></div>
    </form>
  </section>
  </div>
</main>
<div id="tip" hidden></div>

<script type="module">
import { mountOrb } from "/static/orb.js"; // 생각 중 오브
import { renderMarkdown } from "/static/md.js"; // 답의 마크다운 표시
import { mountBeam } from "/static/beam.js"; // 답을 기다리는 동안 입력창 테두리를 도는 빛
import { mountSegment } from "/static/segment.js"; // 포메이션 분포 / 팀컬러 분포 전환
const $ = (id) => document.getElementById(id);
const beam = mountBeam($("msg-beam"));
const SEND_ICON = $("send").innerHTML; // 위쪽 화살표 (답을 기다리는 동안은 ■)

const el = (tag, props = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v; else if (k === "text") node.textContent = v; else node[k] = v;
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
};
const pct = (x) => (x * 100).toFixed(1) + "%";
const season = (s) => (s || "?").split(" (")[0];
const asOf = (v) => v ? v.slice(0, 16).replace("T", " ") + " 기준" : "";

async function failure(res) {
  const d = (await res.json().catch(() => ({}))).detail;
  const err = new Error(typeof d === "string" ? d : Array.isArray(d) ? d.map((e) => e.msg).join(", ") : `오류 (${res.status})`);
  err.status = res.status;
  return err;
}
async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) throw await failure(res);
  return res.json();
}

async function loadMeta() {
  const meta = await api("/api/meta");
  const scope = meta.daily_scope;
  $("asof").textContent = scope
    ? `랭킹 상위 ${scope.top_rankers}명 · 스쿼드 ${scope.squads_collected}명 · ${asOf(scope.data_as_of)}`
    : "아직 수집된 랭킹이 없습니다";
}

// --- tooltip ---
const tip = $("tip");
function showTip(ev, text) {
  tip.textContent = text;
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  const x = Math.min(ev.clientX + 12, window.innerWidth - r.width - 8);
  const y = ev.clientY - r.height - 10 < 8 ? ev.clientY + 16 : ev.clientY - r.height - 10;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = y + "px";
}
const hideTip = () => { tip.hidden = true; };
const hover = (node, text) => {
  node.addEventListener("mousemove", (ev) => showTip(ev, text));
  node.addEventListener("mouseleave", hideTip);
  return node;
};

// --- 분포: 포메이션 / 팀컬러 (위 전환 버튼) ---
const MAX_BARS = 5;  // 더보기를 누르기 전에 보이는 순위
const MODES = {
  formation: {
    list: "/api/formations", rows: (d) => d.formations || [], key: (r) => r.formation,
    scope: (d) => "· " + d.team_color,
    more: 15,  // 더보기를 누르면 이 순위까지
    detail: (name) => "/api/formation?" + new URLSearchParams({ name }),
  },
  team: {
    list: "/api/teamcolors", rows: (d) => d.rows || [], key: (r) => r.team_color, icon: (r) => r.icon,
    scope: (d) => "· " + ((d.scope && d.scope.description) || "랭킹"),
    more: 20,
    detail: (name) => "/api/teamcolor?" + new URLSearchParams({ name }),
  },
};
let mode = "formation";
// 국가 팀컬러는 "브라질(국가)"로 오지만 화면에는 이름만 (조회할 때는 클럽과 구분되도록 원래 이름을 쓴다)
const plain = (name) => name.replace(/\(국가\)$/, "");
let selected = null;

function markSelected() {
  for (const b of $("fchart").querySelectorAll(".row")) b.classList.toggle("sel", b.dataset.key === selected);
}

// 팀컬러 엠블럼·국기 (넥슨 CDN). 모르거나 못 불러오면 같은 크기 빈 자리로 둬서 이름 줄을 맞춘다
function logo(path) {
  if (!path) return el("span", { class: "logo" });
  const img = el("img", { class: "logo", src: `${IMG}/${path}`, alt: "", loading: "lazy" });
  img.addEventListener("error", () => { img.style.visibility = "hidden"; });
  return img;
}

async function loadChart() {
  const m = MODES[mode], want = mode, box = $("fchart");
  try {
    const d = await api(m.list);
    if (mode !== want) return;  // 그사이 전환했으면 버린다
    $("form-scope").textContent = m.scope(d);
    const all = m.rows(d);
    if (!all.length) {
      box.replaceChildren(el("p", { class: "stat", text: d.note || "랭킹 스냅샷이 없습니다." }));
      return;
    }
    const shown = all.slice(0, m.more);
    box.classList.remove("open");
    const max = shown[0].share || 1;
    const rows = [];
    for (const [i, r] of shown.entries()) {
      const key = m.key(r);
      const row = el("button", { type: "button", class: i < MAX_BARS ? "row" : "row extra", ariaLabel: `${plain(key)}, ${pct(r.share)} — 누르면 상세` },
        el("span", { class: "f" }, m.icon ? logo(m.icon(r)) : null, plain(key)),
        el("span", { class: "track" }, el("span", { style: `width:${(r.share / max) * 100}%` })),
        el("span", { class: "v", text: pct(r.share) }));
      row.dataset.key = key;
      row.addEventListener("click", () => showDetail(key));
      rows.push(row);
    }
    if (shown.length > MAX_BARS) {
      const more = el("button", { type: "button", class: "more", text: "더보기" });
      more.addEventListener("click", () => { more.textContent = box.classList.toggle("open") ? "접기" : "더보기"; });
      rows.push(more);
    }
    box.replaceChildren(...rows);
    showDetail(m.key(shown[0]));
  } catch (e) {
    box.replaceChildren(el("p", { class: "error", text: e.message }));
  }
}

// --- formation detail ---
// 선수 사진: 카드 사진 → 선수 기본 사진 → 이름 첫 글자 (넥슨 이미지 CDN을 못 쓰면 글자로 표시)
const IMG = "https://fco.dn.nexoncdn.co.kr/live/externalAssets/common";
function photo(p) {
  const box = el("div", { class: "ph", ariaHidden: "true" });
  const sources = [`${IMG}/playersAction/p${p.sp_id}.png`, `${IMG}/players/p${p.pid}.png`];
  const next = () => {
    const src = sources.shift();
    if (!src) { box.replaceChildren((p.name || "?").slice(0, 1)); return; }
    const img = el("img", { src, alt: "", loading: "lazy" });
    img.onerror = next;
    box.replaceChildren(img);
  };
  next();
  const g = p.grade, tier = g >= 11 ? "platinum" : g >= 8 ? "gold" : g >= 5 ? "silver" : g >= 2 ? "bronze" : "";
  return el("div", { class: "pw" }, box, g ? el("span", { class: "gr " + tier, text: String(g) }) : null);
}

// spposition 코드 → 경기장 위치 [x%, y%] (위쪽이 공격 방향, 오른쪽이 R 포지션)
const POS = {
  0: [50, 91], 1: [50, 80], 2: [88, 57], 3: [85, 73], 4: [66, 78], 5: [50, 79], 6: [34, 78], 7: [15, 73], 8: [12, 57],
  9: [64, 62], 10: [50, 63], 11: [36, 62], 12: [86, 44], 13: [68, 48], 14: [50, 49], 15: [32, 48], 16: [14, 44],
  17: [70, 32], 18: [50, 33], 19: [30, 32], 20: [66, 20], 21: [50, 21], 22: [34, 20],
  23: [84, 17], 24: [63, 10], 25: [50, 10], 26: [37, 10], 27: [16, 17],
};
const POS_NAME = ["GK", "SW", "RWB", "RB", "RCB", "CB", "LCB", "LB", "LWB", "RDM", "CDM", "LDM", "RM", "RCM", "CM", "LCM", "LM",
  "RAM", "CAM", "LAM", "RF", "CF", "LF", "RW", "RS", "ST", "LS", "LW"];

function pitch(players, emptyText, detailOf) {
  const box = el("div", { class: "pitch" }, el("div", { class: "mid" }), el("div", { class: "circle" }),
    el("div", { class: "box top" }), el("div", { class: "box bottom" }));
  if (!players || !players.length) {
    box.append(el("div", { class: "empty-pitch", text: emptyText }));
    return box;
  }
  for (const p of players) {
    const [x, y] = POS[p.position] || [50, 50];
    const short = (p.name || "?").split(" ").pop();
    const icon = p.season_img ? el("img", { src: p.season_img, alt: "", loading: "lazy", onerror() { this.remove(); } }) : null;
    const node = el("div", { class: "pp", style: `left:${x}%;top:${y}%` }, photo(p), el("div", { class: "nm" }, icon, short));
    hover(node, `${POS_NAME[p.position] || ""} ${p.name || "?"}\n${season(p.season)}${p.grade ? ` · ${p.grade}강` : ""}${detailOf(p)}`);
    box.append(node);
  }
  return box;
}

function tile(k, val, sub) {
  return el("div", { class: "tile" }, el("div", { class: "k", text: k }), el("div", { class: "val", text: val }),
            sub ? el("div", { class: "sub", text: sub }) : null);
}

function renderPitchArea(d) {
  const area = el("div");
  const top = d.top_ranker_squad, best = d.best_eleven;
  const what = d.formation ? "이 포메이션을 쓰는" : "이 팀컬러";
  const views = {
    top: () => {
      if (!top) return [el("p", { class: "caption", text: `스쿼드 수집 랭커 중 ${what} 랭커가 아직 없습니다.` }),
                        pitch([], "매일 수집으로 스쿼드가 쌓이면 표시됩니다", () => "")];
      // 포메이션 보기는 팀컬러를, 팀컬러 보기는 그 경기 배치를 함께 보여 준다
      const side = d.formation ? top.team_color || "팀컬러 미상" : top.played_formation || "배치 미상";
      // 구단가치 = 선발 11명 최신 시세 합. 시세를 모르는 선수가 있으면 그만큼 빠져 있어 "이상"
      const value = top.squad_value ? ` · 구단가치 ${top.squad_value}${top.unpriced ? " 이상" : ""}` : "";
      const out = [el("p", { class: "caption", text: `${top.rank}위 랭커 · ${side}${value} · ELO ${Math.round(top.elo)}` })];
      if (d.formation && !top.formation_match)
        out.push(el("div", { class: "notice", text: `이 경기 실제 배치는 ${top.played_formation || "알 수 없음"}입니다 (랭킹 표시는 ${d.formation}).` }));
      out.push(pitch(top.players, "", (p) => (p.rating != null ? ` · 평점 ${p.rating}` : "")));
      return out;
    },
    best: () => {
      if (!best) return [el("p", { class: "caption", text: d.formation ? "이 포메이션으로 실제 경기한 스쿼드가 아직 없습니다." : "스쿼드 수집 랭커 중 이 팀컬러 랭커가 아직 없습니다." }),
                         pitch([], "매일 수집으로 스쿼드가 쌓이면 표시됩니다", () => "")];
      // 최상위 랭커 스쿼드의 캡션 줄만큼 띄워 버튼과 경기장 사이 간격을 맞춘다
      return [el("p", { class: "caption", text: "\u00a0" }), pitch(best.players, "", () => "")];
    },
  };
  const body = el("div");
  const seg = el("div", { class: "seg", role: "tablist" });
  const show = (key) => {

// 서버는 답을 몇 단어씩 묶어 보낸다(/api/chat, 한 줄에 JSON 이벤트 하나). 받은 글은 프레임마다 몇 글자씩 풀어 그린다
async function send(text) {
  if (inflight) return;
  const ctrl = new AbortController();
  setBusy(ctrl);
  say("me", text);
  const mode = deepNext || deepAll || "auto";
  deepNext = null;
  const trace = traceKey ? traceBox() : null;
  if (trace) $("log").append(trace);
  const bubble = el("div");
  $("log").append(bubble);
  $("log").scrollTop = $("log").scrollHeight;
  let stopOrb = thinking(bubble), answer = "", shown = 0, frame = 0;
  const draw = () => {
    shown = Math.min(answer.length, shown + Math.max(2, Math.ceil((answer.length - shown) / 12))); // 밀리면 빨리 따라잡는다
    renderMarkdown(bubble, answer.slice(0, shown));

  const status = (line) => {
    waitLine = line;
    const waited = (performance.now() - started) / 1000;
    const text = line === RECHECK ? line : waited >= 90 ? ALMOST : waited >= 60 ? longWait : line;
    const node = bubble.querySelector(".shimmer"); // 답이 나오기 시작했으면 없다
    if (node && node.textContent !== text) node.replaceWith(el("span", { class: "shimmer fresh", text }));
  };
  const timers = [60, 90].map((sec) => setTimeout(() => status(waitLine), sec * 1000));
  const grow = (piece) => {
    if (stopOrb) { stopOrb(); stopOrb = null; bubble.className = "msg bot"; bubble.removeAttribute("title"); bubble.replaceChildren(); }
    answer += piece;

  };

    const res = await fetch("/api/chat", { method: "POST", headers: headers(), signal: ctrl.signal,
                                           body: JSON.stringify({ message: text, session_id: sessionId, mode, trace: !!trace }) });
    if (!res.ok) throw await failure(res);
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let rest = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      const lines = (rest + value).split("\n");
      rest = lines.pop();
      for (const line of lines) {
        const ev = JSON.parse(line);
        if (trace && (ev.type === "trace" || ev.type === "tool")) addTrace(trace, ev.type === "tool" ? { kind: "tool", ...ev } : ev);
        if (ev.type === "start") sessionId = ev.session_id ?? sessionId;
        else if (ev.type === "delta") grow(ev.text);
        else if (ev.type === "tool" && stopOrb) status(TOOL_STATUS[ev.name]?.(ev.args || {}) || THINKING); // 기다리는 중이면 문구를 그 도구에 맞게

    if (!ctrl.signal.aborted) grow((answer ? "\n\n" : "") + (e.status === 429 ? "" : "오류: ") + e.message);

    bubble.className = "msg bot cancelled";
    bubble.textContent = "답변을 취소했습니다.";
    return;
  }
  if (ctrl.signal.aborted) grow("\n\n*(여기서 멈췄습니다)*");
  else if (!answer) grow("답을 받지 못했습니다.");
  if (mode !== "auto") bubble.after(el("div", { class: "applied", text: `/deep 적용: ${DEEP_NAME[mode]}가 답했습니다` }));
}

    const off = [deepNext && `/deep(${DEEP_NAME[deepNext]})`, deepAll && `/deep --a(${DEEP_NAME[deepAll]})`, traceKey && "/admin --l(생각 표시)",
                 $("chat").classList.contains("comparing") && "/compare"].filter(Boolean);

const shuffled = () => PANE_KEYS.map((k) => [Math.random(), k]).sort((a, b) => a[0] - b[0]).map(([, k]) => k);
function openCompare() {
  compareArmed = true;
  $("chat").classList.add("comparing");
  $("compare").hidden = false;
  $("compare").replaceChildren(...["A", "B", "C"].map((letter) => el("section", { class: "pane" }, el("h3", { text: `답변 ${letter}` }),
    el("div", { class: "body" }, el("p", { class: "caption", text: "질문을 입력하면 세 모델이 동시에 답합니다. (1시간에 2번)" })))));
  $("msg").focus();
}
function closeCompare() {
  if (inflight && !compareArmed) inflight.abort();
  compareArmed = false;
  $("chat").classList.remove("comparing");
  $("compare").hidden = true;
}
$("compare-close").addEventListener("click", closeCompare);

// /compare 다음 질문: 세 칸이 같은 질문에 동시에 답한다 (/api/compare, 이벤트마다 pane)
let compareId = null;
// 비교에서 고른 답: 한 번 누르면 초록 테두리, 같은 칸을 한 번 더 누르면(키보드는 Enter 두 번) 확인 창. 고르면 다른 답은 사라지고,
// 서버가 그 질문·답을 대화에 남기며(이어지는 질문의 맥락) 화면은 일반 채팅에서 답한 것처럼 돌아간다
function makeSelectable(p, question, all) {
  p.section.classList.add("selectable");
  p.section.tabIndex = 0;
  p.section.setAttribute("aria-label", `${p.title} — 누르면 표시, 한 번 더 누르면 이 답을 고릅니다`);
  const ask = async () => {
    if (!$("chat").classList.contains("comparing")) return;
    const dialog = $("pick-dialog");
    dialog.returnValue = "";
    dialog.showModal();
    await new Promise((done) => dialog.addEventListener("close", done, { once: true }));
    if (dialog.returnValue !== "yes") return;
    const res = await fetch("/api/compare/choice", { method: "POST", headers: { "Content-Type": "application/json" },
                                                     body: JSON.stringify({ compare_id: compareId, pane: p.key }) }).catch(() => null);
    if (!res || !res.ok) { p.answer.prepend(el("p", { class: "admin-note", text: "고르지 못했어요. 다시 두 번 눌러 주세요." })); return; }
    for (const other of all) if (other !== p) other.section.classList.add("gone");
    setTimeout(() => {
      closeCompare();
      say("me", question);
      const bubble = el("div", { class: "msg bot" });
      renderMarkdown(bubble, p.text);
      $("log").append(bubble);
      $("log").scrollTop = $("log").scrollHeight;
    }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 280);
  };
  const press = () => {
    if (!p.section.classList.contains("marked")) { // 처음 누르면 이 칸만 초록 테두리
      for (const other of all) other.section.classList.remove("marked");
      p.section.classList.add("marked");
      return;
    }
    ask();
  };
  p.section.addEventListener("click", (ev) => { if (!getSelection().toString()) press(); }); // 글을 끌어 고른 건 누름으로 치지 않는다
  p.section.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && ev.target === p.section) press(); });
}
async function sendCompare(text) {
  compareArmed = false;
  const ctrl = new AbortController();
  setBusy(ctrl);
  const panes = {}, started = performance.now();
  $("compare").replaceChildren(...shuffled().map((key, i) => {
    const title = `답변 ${"ABC"[i]}`, stat = el("span", { class: "stat", text: "" }), body = el("div", { class: "body" });
    const trace = traceKey ? traceBox() : null, answer = el("div", { class: "msg bot" });
    body.append(el("div", { class: "msg me", text }), ...(trace ? [trace] : []), answer);
    answer.append(el("span", { class: "shimmer", text: THINKING }));
    const section = el("section", { class: "pane" }, el("h3", {}, el("span", { text: title }), stat), body);
    panes[key] = { key, title, section, stat, body, trace, answer, text: "" };
    return section;
  }));
  try {
    const res = await fetch("/api/compare", { method: "POST", headers: headers(), signal: ctrl.signal,
                                              body: JSON.stringify({ message: text, session_id: sessionId, trace: !!traceKey }) });
    if (!res.ok) throw await failure(res);
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let rest = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      const lines = (rest + value).split("\n");
      rest = lines.pop();
      for (const line of lines) {
        const ev = JSON.parse(line), p = panes[ev.pane];
        if (ev.type === "start") { sessionId = ev.session_id ?? sessionId; compareId = ev.compare_id; }
        if (ev.type === "all_done") { // 세 칸이 다 끝나면 고를 수 있다
          const all = Object.values(panes);
          for (const q of all) if (q.ok && q.text) makeSelectable(q, text, all);
        }
        if (!p) continue;
        if (p.trace && (ev.type === "trace" || ev.type === "tool")) addTrace(p.trace, ev.type === "tool" ? { kind: "tool", ...ev } : ev);
        if (ev.type === "delta") { p.text += ev.text; renderMarkdown(p.answer, p.text); }
        else if (ev.type === "reset") { p.text = ""; p.answer.replaceChildren(el("span", { class: "shimmer", text: THINKING })); }
        else if (ev.type === "tool" && !p.text) p.answer.replaceChildren(el("span", { class: "shimmer", text: TOOL_STATUS[ev.name]?.(ev.args || {}) || THINKING }));
        else if (ev.type === "done") { p.stat.textContent = `${((performance.now() - started) / 1000).toFixed(1)}초`; p.ok = !ev.error; }
      }
    }
  } catch (e) {
    if (!ctrl.signal.aborted) for (const p of Object.values(panes)) if (!p.text) p.answer.textContent = (e.status === 429 ? "" : "오류: ") + e.message;
  }
  setBusy(null);
}

$("chat-form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const text = $("msg").value.trim();
  if (!text || inflight) return; // 답을 기다리는 중에는 입력한 글을 그대로 둔다
  $("msg").value = "";
  if (text.startsWith("/")) return command(text);
  if (compareArmed) return sendCompare(text);
  if ($("chat").classList.contains("comparing")) closeCompare(); // 비교를 본 뒤 다음 질문은 원래 채팅으로
  send(text);
});
// 입력창 안내: 예시 질문(static/examples.txt) 중 하나를 무작위로
fetch("/static/examples.txt").then((r) => r.text()).then((t) => {
  const qs = t.split("\n").filter((q) => q.trim());
  $("msg").placeholder = `예: ${qs[Math.floor(Math.random() * qs.length)]}`;
}).catch(() => {});
say("bot intro", "시세와 게임 데이터는 수집 시각 기준이며 이적시장에 따라 소폭 변동될 수 있습니다. 무엇이든 물어보세요.");

mountOrb($("brand-orb"), "solving", 32);
loadMeta().catch((e) => { $("asof").textContent = "불러오기 실패: " + e.message; });
mountSegment($("dist-mode"), [{ value: "formation", label: "포메이션 분포" }, { value: "team", label: "팀컬러 분포" }], {
  ariaLabel: "분포 보기 전환",
  onChange: (v) => { mode = v; selected = null; loadChart(); },
});
loadChart();
</script>
</body>
